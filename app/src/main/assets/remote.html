<script>
'use strict';
const $=id=>document.getElementById(id),store={get(){try{return localStorage.getItem('tv-token')||sessionStorage.getItem('tv-token')||''}catch{try{return sessionStorage.getItem('tv-token')||''}catch{return ''}}},set(v){for(const name of ['localStorage','sessionStorage'])try{if(v)window[name].setItem('tv-token',v);else window[name].removeItem('tv-token')}catch{}}};
let livePending=null,lastLiveSnapshot="",liveSwitching=false;
let token=store.get(),tab='remote',activeUpload=null,toastTimer,liveData={channels:[],sources:[]},visibleLimit=80,liveBusy=false,favoriteOnly=false;
if(token)store.set(token);
const invite=new URL(location.href),secret=new URLSearchParams(invite.hash.slice(1)).get('connect')||invite.searchParams.get('connect');if(invite.hash||invite.searchParams.has('connect')){invite.hash='';invite.searchParams.delete('connect');history.replaceState(null,'',invite.pathname+invite.search)}
function say(message,error=false){
  clearTimeout(toastTimer);
  const toast=$('toast'),modal=document.querySelector('dialog[open]');
  if(typeof toast.showPopover==='function'){
    toast.setAttribute('popover','manual');
  }else{
    (modal||document.body).append(toast);
  }
  toast.textContent=message;
  toast.dataset.error=String(error);
  toast.hidden=false;
  if(typeof toast.showPopover==='function')toast.showPopover();
  toastTimer=setTimeout(()=>{
    if(typeof toast.hidePopover==='function')toast.hidePopover();
    toast.hidden=true;
  },1000);
}
function connection(state,label){document.body.dataset.connection=state;$('reconnect').hidden=!token||state!=='offline';}
function render(){const paired=!!token;$('workspace').hidden=!paired;$('tabs').hidden=!paired;$('pairing').hidden=paired;if(!paired)connection('offline','未连接');}
async function post(path,body='',timeout=15000){const controller=new AbortController(),timer=setTimeout(()=>controller.abort(),timeout);try{const r=await fetch(path,{method:'POST',headers:{'X-TV-Token':token,'Content-Type':'text/plain;charset=UTF-8'},body,signal:controller.signal,cache:'no-store'});const text=await r.text();if(r.status===401){token='';store.set('');render();throw Error('连接已过期，请重新扫描电视二维码。')}if(!r.ok){const error=Error(text||'操作失败');error.status=r.status;throw error;}return text;}catch(e){if(e.name==='AbortError')throw Error('连接超时，请检查手机与电视的网络。');if(e instanceof TypeError)throw Error('暂时无法连接电视，请检查同一 Wi-Fi 及本地网络权限。');throw e;}finally{clearTimeout(timer)}}
let checkPending=null;
async function ensurePad(status=null){
 if(!padMode||!token)return false;
 if(browserMode)return true;
 if(padSync)return padSync;
 padSync=(async()=>{
  let s=status||JSON.parse(await post('/status','',5000));
  if(!s.pointerReady&&s.adbReady&&s.overlayAllowed){await post('/command','pointerMode\non',10000);s=JSON.parse(await post('/status','',5000))}
  padReady=!!s.pointerReady;return padReady;
 })();
 try{return await padSync}finally{padSync=null}
}
async function check(){
 if(!token)return;
 if(checkPending)return checkPending;
 checkPending=(async()=>{
   let status;
   try{status=JSON.parse(await post('/status','',5000))}
   catch(e){padReady=false;connection('offline','连接中断');if(!token)say(e.message,true);return false}
   connection('online','已连接');
   if(browserMode)renderBrowser(status.browser);
   padReady=!!status.pointerReady;
   refreshPadSetup();
   return true;
 })();
 try{return await checkPending}finally{checkPending=null}
}
async function pair(code){$('connecting').hidden=false;$('pairForm').hidden=true;try{token=await post('/pair',code);store.set(token);render();switchTab('remote');connection('online','已连接');if(await check())say('已连接电视，可以开始使用。')}catch(e){render();if(token)await check();else say(e.message,true)}finally{$('connecting').hidden=true;$('pairForm').hidden=false;}}
$('retryConnection').onclick=async()=>{const button=$('retryConnection');button.disabled=true;try{if(await check())say('已重新连接');else if(token)say('暂时无法连接电视，请确认电视地址和网络。',true)}finally{button.disabled=false}};
async function command(cmd,value='',quiet=false){try{await post('/command',cmd+'\n'+value);if(!quiet)say(cmd==='livePlay'?'已在电视全屏打开频道。':'已执行');return true;}catch(e){say(e.message,true);return false;}}

function showRemoteText(show){$('toggleRemoteText').setAttribute('aria-expanded',String(show));if(show){openDialog('remoteTextDialog');$('remoteText').focus()}else{$('remoteTextDialog').close();$('remoteText').blur();$('toggleRemoteText').focus()}}
$('remoteTextDialog').addEventListener('close',()=>{$('toggleRemoteText').setAttribute('aria-expanded','false')});
$('toggleRemoteText').onclick=()=>showRemoteText(!$('remoteTextDialog').open);
$('remoteTextForm').onsubmit=async e=>{e.preventDefault();const value=$('remoteText').value;if(!value.length)return;const send=$('sendRemoteText');send.disabled=true;try{const result=await post('/command','inputText\n'+value,30000);$('remoteText').value='';showRemoteText(false);say(result||'已输入到电视')}catch(error){say(error.message,true)}finally{send.disabled=false}};
let padReady=false,padSync=null,padMode=false,padGesture=null,padPending={x:0,y:0,scroll:false},padSending=false,padTimer=null;
function resetPad(){padReady=false;padGesture=null;padPending={x:0,y:0,scroll:false};clearTimeout(padTimer);padTimer=null;$('touchpad').classList.remove('active')}
const pendingRemoteKeys=[];
let sendingRemoteKeys=false;
async function queueRemoteKey(key){
  if(pendingRemoteKeys.length>=8)return;
  pendingRemoteKeys.push(key);
  if(sendingRemoteKeys)return;
  sendingRemoteKeys=true;
  const session=token;
  try{
    while(pendingRemoteKeys.length&&session&&token===session){
      if(!await command(pendingRemoteKeys.shift(),'',true))break;
      await new Promise(resolve=>setTimeout(resolve,45));
    }
  }finally{
    pendingRemoteKeys.length=0;
    sendingRemoteKeys=false;
  }
}
let browserMode=false;
function refreshPadSetup(){ $('pointerSetup').hidden=!padMode||browserMode||padReady; }
function setRemoteMode(mode){
  resetPad();
  pendingRemoteKeys.length=0;
  browserMode=mode==='browser';
  padMode=mode!=='keys';
  $('remoteControls').hidden=browserMode;
  $('browserControls').hidden=!browserMode;
  $(browserMode?'browserPadSlot':'remotePadSlot').append($('touchPanel'));
  $('touchPadTitle').textContent=browserMode?'滑动控制网页光标':'滑动控制全局光标';
  $('keyPanel').hidden=padMode;
  $('touchPanel').hidden=!padMode;
  $('keysMode').setAttribute('aria-pressed',String(mode==='keys'));
  $('padMode').setAttribute('aria-pressed',String(mode==='pad'));
  $('browserTools').setAttribute('aria-pressed',String(browserMode));
  refreshPadSetup();
  try{localStorage.setItem('one-pad-mode',mode)}catch{}
}
$('keysMode').onclick=()=>setRemoteMode('keys');
$('padMode').onclick=()=>{setRemoteMode('pad');check()};
$('pointerSetup').onclick=()=>command('pointerSetup','',true);
$('browserTools').onclick=()=>{setRemoteMode('browser');check()};
try{const saved=localStorage.getItem('one-pad-mode');setRemoteMode(saved==='pad'||saved==='browser'?saved:'keys')}catch{setRemoteMode('keys')}
async function flushPad(){
 clearTimeout(padTimer);padTimer=null;if(padSending||!padMode)return;
 const p=padPending;if(!p.x&&!p.y)return;padPending={x:0,y:0,scroll:p.scroll};padSending=true;
 const body=(browserMode?(p.scroll?'browserTouchScroll':'browserTouchMove'):(p.scroll?'touchScroll':'touchMove'))+'\n'+Math.round(p.x)+','+Math.round(p.y);
 try{
  if(!padReady&&!await ensurePad())throw Error('请先在遥控设置中开启系统遥控和全局光标');
  if(!padMode)return;
  try{await post('/command',body,4000)}catch(e){padReady=false;if(e.status===409&&!p.scroll&&await ensurePad())await post('/command',body,4000);else throw e}
 }catch(e){padReady=false;padPending.x=padPending.y=0;say(e.message,true)}finally{padSending=false;if(padMode&&(padPending.x||padPending.y))padTimer=setTimeout(flushPad,40)}
}
async function tapPad(){try{if(!padReady&&!await ensurePad())throw Error('请先在遥控设置中开启系统遥控和全局光标');if(padMode&&!await command(browserMode?'browserTouchClick':'touchClick','',true))padReady=false}catch(e){padReady=false;say(e.message,true)}}
function queuePad(x,y,scroll){if(padPending.scroll!==scroll){padPending.x=padPending.y=0}padPending.scroll=scroll;padPending.x=Math.max(-240,Math.min(240,padPending.x+x));padPending.y=Math.max(-240,Math.min(240,padPending.y+y));if(!padTimer&&!padSending)padTimer=setTimeout(flushPad,40)}
const pad=$('touchpad');
function touchCenter(touches){return {x:Array.from(touches).reduce((n,t)=>n+t.clientX,0)/touches.length,y:Array.from(touches).reduce((n,t)=>n+t.clientY,0)/touches.length}}
pad.addEventListener('touchstart',e=>{e.preventDefault();const c=touchCenter(e.touches);if(!padGesture)padGesture={start:Date.now(),distance:0,multi:false};Object.assign(padGesture,{x:c.x,y:c.y,count:e.touches.length,multi:padGesture.multi||e.touches.length>1});pad.classList.add('active')},{passive:false});
pad.addEventListener('touchmove',e=>{e.preventDefault();if(!padGesture)return;const c=touchCenter(e.touches),g=padGesture;if(e.touches.length===g.count){const x=c.x-g.x,y=c.y-g.y;g.distance+=Math.hypot(x,y);queuePad(g.multi?-x*2:x*1.8,g.multi?-y*2:y*1.8,g.multi)}Object.assign(g,{x:c.x,y:c.y,count:e.touches.length})},{passive:false});
pad.addEventListener('touchend',e=>{e.preventDefault();if(e.touches.length){if(padGesture){const c=touchCenter(e.touches);Object.assign(padGesture,{x:c.x,y:c.y,count:e.touches.length})}return}const g=padGesture;padGesture=null;pad.classList.remove('active');flushPad();if(g&&!g.multi&&g.distance<8&&Date.now()-g.start<350)tapPad()},{passive:false});
pad.addEventListener('touchcancel',()=>{padGesture=null;padPending.x=padPending.y=0;clearTimeout(padTimer);padTimer=null;pad.classList.remove('active')});


const engines={
  bing:'https://cn.bing.com/search?q=',
  baidu:'https://www.baidu.com/s?wd=',
  google:'https://www.google.com/search?q='

  close.onclick=()=>{if(app.folder&&!app.folderTile)editFolder(app.folder);else dialog.close()};
  close.textContent=app.folder&&!app.folderTile?'返回文件夹':'关闭';
  if(!dialog.open)dialog.showModal();
  $('appEditTitle').focus({preventScroll:true});
}
function editFolder(name){
  const dialog=$('appEditDialog'),actions=$('appActions'),art=$('appSheetArt');
  art.hidden=true;art.replaceChildren();
  dialog.dataset.mode='folder';
  $('appEditTitle').textContent=name;
  $('closeAppEdit').textContent='关闭';
  $('closeAppEdit').onclick=()=>dialog.close();
  const form=appNameForm(name,'文件夹名称',20,next=>saveApps('appsEdit',{op:'renameFolder',folder:name,name:next},()=>editFolder(next)),false);
  const grid=document.createElement('div');grid.className='folder-app-grid';
  const members=appsData.apps.filter(app=>!app.hidden&&app.folder===name);
  grid.append(...buildAppTiles(members));
  const dissolve=document.createElement('button');dissolve.className='app-sheet-row';
  dissolve.dataset.danger='true';dissolve.textContent='解散文件夹';
  dissolve.onclick=()=>editApp({title:name,folderTile:true});
  const group=document.createElement('div');group.className='app-sheet-group';group.append(dissolve);
  const scroll=document.createElement('div');scroll.className='folder-app-scroll';scroll.append(grid);
  actions.replaceChildren(form,scroll,group);
  if(!dialog.open)dialog.showModal();
  $('appEditTitle').focus({preventScroll:true});
}

function renderChannels(){const query=$('channelSearch').value.trim().toLowerCase(),group=$('channelGroup').value;const pool=favoriteOnly?(liveData.favoriteChannels||liveData.channels.filter(c=>c.favorite)):liveData.channels;const filtered=pool.filter(c=>(c.name+' '+c.group).toLowerCase().includes(query)&&(favoriteOnly||group==='全部频道'||c.group===group));const items=filtered.slice(0,visibleLimit).map(c=>{const row=document.createElement('div');row.className='channel';const mark=document.createElement('span');mark.className='channel-mark';mark.textContent=c.name.slice(0,2);const info=document.createElement('div');info.className='channel-info';const title=document.createElement('strong');title.textContent=c.name;const detail=document.createElement('small');detail.textContent=categoryLabel(c.group)+(c.streams.length>1?' · '+c.streams.length+' 条线路':'');info.append(title,detail);const favorite=document.createElement('button');favorite.className='favorite';const star=document.createElementNS('http://www.w3.org/2000/svg','svg'),starUse=document.createElementNS('http://www.w3.org/2000/svg','use');starUse.setAttribute('href','#star');star.append(starUse);favorite.append(star);favorite.setAttribute('aria-label',(c.favorite?'取消收藏 ':'收藏 ')+c.name);favorite.setAttribute('aria-pressed',String(!!c.favorite));favorite.onclick=async()=>{if(await command('liveFavorite',c.id,true)){c.favorite=!c.favorite;await loadLive();}};const play=document.createElement('button');play.className='channel-play';play.textContent='播放';play.setAttribute('aria-label','播放 '+c.name);play.onclick=()=>command('livePlay',c.id);row.append(mark,info,favorite,play);return row;});$('channelList').replaceChildren(...items);if(!items.length){const empty=document.createElement('div');empty.className='live-empty';empty.textContent=favoriteOnly?'还没有收藏的频道':liveData.channels.length?'没有找到相关频道。':'添加节目单订阅，或导入本地文件。';$('channelList').append(empty);}$('moreChannels').hidden=filtered.length<=visibleLimit;}
function restoreLastCategory(){if(!favoriteOnly)return;favoriteOnly=false;visibleLimit=80;updateFavoriteFilter();renderChannels()}
$('channelGroup').addEventListener('focus',restoreLastCategory);$('channelGroup').addEventListener('pointerdown',restoreLastCategory);
$('channelSearch').oninput=()=>{visibleLimit=80;renderChannels()};$('channelGroup').onchange=()=>{favoriteOnly=false;updateFavoriteFilter();visibleLimit=80;renderChannels()};function updateFavoriteFilter(){$('favoriteChannels').setAttribute('aria-selected',String(favoriteOnly));$('favoriteChannels').className='category-tab';renderCategoryFilters();}$('favoriteChannels').onclick=()=>{favoriteOnly=true;updateFavoriteFilter();visibleLimit=80;renderChannels()};$('moreChannels').onclick=()=>{visibleLimit+=80;renderChannels()};function openLiveDialog(){if(liveData.playerMode==='default')openDialog('liveDialog');}$('addLive').onclick=openLiveDialog;$('addSource').onclick=()=>{$('sourceDialog').close();openLiveDialog()};
async function liveJob(path,body,control=null,label='处理中'){
 if(liveBusy){say('正在处理直播源，请稍候。');return false;}
 liveBusy=true;
 const states=Array.from(document.querySelectorAll('#liveDialog button:not(.dialog-close),#liveDialog input,#liveDialog textarea,#sourceDialog button:not(.dialog-close)'),node=>[node,node.disabled]);
 const caption=control?(control.tagName==='BUTTON'?control:control.querySelector('span')):null,original=caption?caption.innerHTML:'';
 states.forEach(([node])=>node.disabled=true);
 if(control){control.classList.add('is-loading');control.setAttribute('aria-busy','true');if(caption)caption.textContent=label+'…';}
 try{const value=typeof body==='function'?await body():body;const result=await post(path,value,120000);say(result);await loadLive();return true;}
 catch(e){say(e.message,true);return false;}
 finally{liveBusy=false;states.forEach(([node,disabled])=>node.disabled=disabled);if(control){control.classList.remove('is-loading');control.removeAttribute('aria-busy');if(caption)caption.innerHTML=original;}}
}

$('playlistFile').onchange=async()=>{const file=$('playlistFile').files[0];if(!file)return;if(file.size>20971520){say('节目单最大 20 MB',true);$('playlistFile').value='';return;}try{if(await liveJob('/live/import',()=>file.text(),$('playlistFile').closest('.drop'),'导入中'))$('liveDialog').close();}finally{$('playlistFile').value=''}};

$('sourcesButton').onclick=async()=>{await loadLive();if(liveData.playerMode!=='default')return;$('sourceList').replaceChildren(...liveData.sources.map(s=>{const section=document.createElement('div');section.className='section glass';const title=document.createElement('h2');title.textContent=(s.name)+' · '+s.count+' 个频道';const controls=document.createElement('div');controls.className='split';const choose=document.createElement('button');choose.className='secondary compact';choose.textContent=s.url===liveData.active?'使用中':'切换';choose.disabled=s.url===liveData.active;choose.onclick=async()=>{await command('liveSource',s.url,true);await loadLive();$('sourceDialog').close()};controls.append(choose);if(s.url!=='local'){const update=document.createElement('button');update.className='secondary compact';update.textContent='更新频道';update.onclick=()=>liveJob('/live/subscribe',s.url);controls.append(update)}const remove=document.createElement('button');remove.className='text-button';remove.textContent='删除';remove.onclick=async()=>{if(confirm('删除这个直播源？')){await command('liveRemove',s.url,true);await loadLive();section.remove()}};controls.append(remove);section.append(title,controls);return section}));openDialog('sourceDialog');};
