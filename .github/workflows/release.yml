name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      verify_only:
        description: Build and verify signed APKs without publishing a release
        type: boolean
        default: true

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    if: github.ref_type == 'tag' || (github.event_name == 'workflow_dispatch' && inputs.verify_only && github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Check version and install Android SDK
        env:
          VERIFY_ONLY: ${{ github.event_name == 'workflow_dispatch' && inputs.verify_only }}
        run: |
          set -euo pipefail
          apk_version="$(sed -n "s/^ *versionName '\([^']*\)'$/\1/p" app/build.gradle)"
          [[ "$apk_version" =~ ^[0-9]+\.[0-9]+(\.[0-9]+)?$ ]]
          version="$apk_version"
          if [[ "$VERIFY_ONLY" != true ]]; then
            [[ "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+(\.[0-9]+)?$ ]]
            version="${GITHUB_REF_NAME#v}"
            [[ "$apk_version" == "$version" || "$version" == "$apk_version.0" || "$apk_version" == "$version.0" ]]
          fi
          echo "APK_VERSION=$apk_version" >> "$GITHUB_ENV"
          echo "VERSION=$version" >> "$GITHUB_ENV"
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-35" "build-tools;35.0.0" >/dev/null
      - name: Check for staged packages
        if: github.event_name != 'workflow_dispatch' || !inputs.verify_only
        id: stage
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          status="$(gh release view "$GITHUB_REF_NAME" --json isDraft --jq .isDraft 2>/dev/null || true)"
          if [[ "$status" == false ]]; then
            echo 'published=true' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [[ "$status" == true ]]; then
            mkdir staged
            gh release download "$GITHUB_REF_NAME" --dir staged
            if [[ -f staged/SHA256SUMS.txt && -f "staged/One-$APK_VERSION.apk" && -f "staged/One-$APK_VERSION-arm64-v8a.apk" && -f "staged/One-$APK_VERSION-armeabi-v7a.apk" ]]; then
              echo 'ready=true' >> "$GITHUB_OUTPUT"
            fi
          fi
      - name: Build signed APKs
        if: steps.stage.outputs.published != 'true' && steps.stage.outputs.ready != 'true'
        env:
          KEY_DATA: ${{ secrets.ONE_KEYSTORE_BASE64 }}
          ONE_KEYSTORE_PASSWORD: ${{ secrets.ONE_KEYSTORE_PASSWORD }}
          ONE_KEY_ALIAS: ${{ secrets.ONE_KEY_ALIAS }}
          ONE_KEY_PASSWORD: ${{ secrets.ONE_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          for variable in KEY_DATA ONE_KEYSTORE_PASSWORD ONE_KEY_ALIAS ONE_KEY_PASSWORD; do
            if [[ -z "${!variable}" ]]; then
              echo "::error::Missing release signing configuration: $variable"
              exit 1
            fi
          done
          umask 077
          export ONE_KEYSTORE_PATH="$RUNNER_TEMP/one.keystore"
          trap 'rm -f "$ONE_KEYSTORE_PATH"' EXIT
          printf '%s' "$KEY_DATA" | base64 --decode > "$ONE_KEYSTORE_PATH"
          expected=2157f906b100ae2b111f582978bc31cd56df6c40154741900cd336d391bc84ab
          actual="$(keytool -exportcert -keystore "$ONE_KEYSTORE_PATH" -alias "$ONE_KEY_ALIAS" -storepass:env ONE_KEYSTORE_PASSWORD | sha256sum | cut -d' ' -f1)"
          if [[ "$actual" != "$expected" ]]; then
            echo "::error::Configured release certificate is $actual; expected $expected"
            exit 1
          fi
          ./gradlew :app:assembleRelease
      - name: Verify packages and prepare assets
        if: steps.stage.outputs.published != 'true'
        env:
          STAGED: ${{ steps.stage.outputs.ready }}
        run: |
          set -euo pipefail
          dir=app/build/outputs/apk/release
          if [[ "$STAGED" == true ]]; then
            python3 scripts/verify-apks.py staged/*.apk
            (cd staged && sha256sum -c SHA256SUMS.txt)
          else
            python3 scripts/verify-apks.py "$dir"/*release.apk
          fi
          expected=2157f906b100ae2b111f582978bc31cd56df6c40154741900cd336d391bc84ab
          code="$(sed -n 's/^ *versionCode \([0-9]*\)$/\1/p' app/build.gradle)"
          tools="$ANDROID_HOME/build-tools/35.0.0"
          mkdir dist
          for abi in universal arm64-v8a armeabi-v7a; do
            name="One-$APK_VERSION"
            if [[ "$abi" != universal ]]; then name="$name-$abi"; fi
            apk="$dir/app-$abi-release.apk"
            if [[ "$STAGED" == true ]]; then apk="staged/$name.apk"; fi
            cert="$("$tools/apksigner" verify --print-certs "$apk")"
            if ! grep -Fx "Signer #1 certificate SHA-256 digest: $expected" <<< "$cert"; then
              grep -F "certificate SHA-256 digest:" <<< "$cert"
              exit 1
            fi
            badging="$("$tools/aapt" dump badging "$apk")"
            grep -F "package: name='com.tvbridge.app' versionCode='$code' versionName='$APK_VERSION'" <<< "$badging"
            if [[ "$abi" != universal ]]; then
              grep -Fx "native-code: '$abi'" <<< "$badging"
            else
              grep -Fx "native-code: 'arm64-v8a' 'armeabi-v7a'" <<< "$badging"
            fi
            cp "$apk" "dist/$name.apk"
          done
          if [[ "$VERSION" != "$APK_VERSION" ]]; then
            cp "dist/One-$APK_VERSION.apk" "dist/One-$VERSION.apk"
          fi
          (cd dist && sha256sum *.apk > SHA256SUMS.txt)
      - name: Publish release
        if: steps.stage.outputs.published != 'true' && (github.event_name != 'workflow_dispatch' || !inputs.verify_only)
        env:
          GH_TOKEN: ${{ github.token }}
          STAGED: ${{ steps.stage.outputs.ready }}
        run: |
          set -euo pipefail
          tag="$GITHUB_REF_NAME"
          if status="$(gh release view "$tag" --json isDraft --jq .isDraft)"; then
            [[ "$status" == true ]] || exit 0
          else
            awk -v version="$APK_VERSION" '$0 == "## " version { found=1; next } /^## / && found { exit } found { print }' CHANGELOG.md > release-notes.md
            grep -q '[^[:space:]]' release-notes.md
            gh release create "$tag" --verify-tag --draft --title "OneTV $APK_VERSION" --notes-file release-notes.md
          fi
          gh release upload "$tag" dist/* --clobber
          gh release edit "$tag" --draft=false --latest
